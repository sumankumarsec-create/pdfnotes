<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>Store — NOTES.</title>
<meta name="description" content="The NOTES. store is on its way — check back soon.">
<link rel="canonical" href="https://pdfsent.com/stores/">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --black:#0a0a0a; --white:#ffffff; --grey:#6b6b6b; --grey-light:#e8e8e8; --ease:cubic-bezier(.22,.61,.36,1); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  .skip-link{
    position:absolute; left:-9999px; top:0; z-index:1200;
    background:var(--black); color:var(--white); padding:12px 18px;
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.04em; text-decoration:none;
  }
  .skip-link:focus{ left:12px; top:12px; }
  a:focus-visible{ outline:2.5px solid var(--black); outline-offset:2px; }
  body{ background:var(--white); color:var(--black); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:820px; margin:0 auto; padding:0 32px; }
  header.site{ border-bottom:2px solid var(--black); padding:28px 0 20px; }
  .top-row{ display:flex; align-items:baseline; justify-content:space-between; gap:24px; flex-wrap:wrap; max-width:820px; margin:0 auto; padding:0 32px; }
  .logo{ font-family:'Fraunces', serif; font-weight:600; font-size:28px; letter-spacing:-0.01em; text-decoration:none; color:var(--black); }
  .logo span{ font-style:italic; font-weight:500; color:var(--grey); }
  .site-tag{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey); }
  main{ padding:120px 0; text-align:center; }
  .icon-wrap{ margin-bottom:24px; }
  .icon-wrap svg{ width:40px; height:40px; stroke:var(--grey); }
  .kicker{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey); margin-bottom:14px; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:clamp(30px, 4.6vw, 44px); line-height:1.1; letter-spacing:-0.02em; margin-bottom:16px; }
  p{ font-size:16px; line-height:1.7; color:#2a2a2a; max-width:440px; margin:0 auto 32px; }
  .back{ display:inline-block; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--black); text-decoration:none; border-bottom:1px solid var(--black); }
  footer{ border-top:2px solid var(--black); padding:28px 0; }
  .footer-nav{ display:flex; flex-wrap:wrap; gap:20px; margin-bottom:18px; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.05em; text-transform:uppercase; justify-content:center; }
  .footer-nav a{ color:var(--black); text-decoration:none; border-bottom:1px solid transparent; transition:border-color .15s var(--ease); }
  .footer-nav a:hover{ border-color:var(--black); }
  .foot-row{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--grey); }
  @media (max-width:640px){ .wrap, .top-row{ padding:0 18px; } main{ padding:80px 0; } }
</style>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to content</a>

<header class="site">
  <div class="top-row">
    <a class="logo" href="../index.html">NOTES<span>.</span></a>
    <div class="site-tag">Study &amp; Reference Archive — Black / White Edition</div>
  </div>
</header>

<main class="wrap" id="main-content">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M3 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M5 9v10h14V9"/><path d="M9 21v-6h6v6"/></svg>
  </div>
  <div class="kicker">Store</div>
  <h1>Coming soon.</h1>
  <p>The NOTES. store isn't open yet. Come back later — for now, the full archive of free PDF notes is still the main thing here.</p>
  <a class="back" href="../index.html">← Back to the archive</a>
</main>

<footer>
  <div class="wrap">
    <nav class="footer-nav">
      <a href="../about.html">About</a>
      <a href="../blog.html">Blog</a>
      <a href="../contact.html">Contact</a>
      <a href="../privacy.html">Privacy Policy</a>
      <a href="../terms.html">Terms of Use</a>
    </nav>
    <div class="foot-row">
      <span id="year"></span>
    </div>
  </div>
</footer>

<script>document.getElementById('year').textContent = '© ' + new Date().getFullYear() + ' NOTES. All rights reserved.';</script>
</body>
</html>
